name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Typecheck, unit tests, build and API tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: efie
          POSTGRES_PASSWORD: efie
          POSTGRES_DB: efie_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U efie -d efie_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Throwaway database and secret that exist only inside this CI run.
      DATABASE_URL: postgresql://efie:efie@localhost:5432/efie_test
      DATABASE_URL_UNPOOLED: postgresql://efie:efie@localhost:5432/efie_test
      JWT_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Create tables and load demo data
        run: |
          npx prisma migrate deploy
          npx prisma db seed

      - name: Build
        run: npm run build

      - name: Start the app
        run: |
          npm start > server.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:3000/api/auth/me > /dev/null && exit 0
            sleep 1
          done
          echo "Server did not start in time"; cat server.log; exit 1

      - name: API tests
        run: npm run test:api

      - name: Server log
        if: failure()
        run: cat server.log || true
